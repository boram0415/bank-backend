spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/accountdb}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: INFO
    com.boram.account: INFO
